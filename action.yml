name: Buildalon unity-uwp-builder
description: A GitHub Action to build Unity exported UWP projects.
branding:
  icon: package
  color: red
inputs:
  project-path:
    description: The directory that contains the exported visual studio project from Unity.
    required: true
  configuration:
    description: The configuration to use when building the visual studio project. Defaults to `Master`.
    required: false
    default: 'Master'
  architecture:
    description: 'The architecture to use when building the visual studio project. Can be: `x86`, `x64`, `ARM`, or `ARM64`. Defaults to `x64|ARM64`.'
    required: false
    default: 'x64|ARM64'
  package-type:
    description: 'The type of package to generate. Can be: `sideload` or `upload`. Defaults to `sideload`.'
    required: false
    default: 'sideload'
  certificate-path:
    description: 'The path to the certificate to use when packaging the UWP project. Required when `package-type` is `sideload`. Defaults to the Unity generated test certificate.'
    required: false
  certificate-password:
    description: 'The password for the certificate to use when packaging the UWP project. Required when providing your own certificate.'
    required: false
  windows-sdk-version:
    description: 'The Windows SDK version to use for building. If not specified, the latest available SDK version will be automatically detected and used.'
    required: false
  additional-args:
    description: Additional arguments to pass to the msbuild command.
    required: false
outputs:
  bundles:
    description: The paths to the generated bundles in json array.
  output-directory:
    description: The path to the output-directory.
runs:
  using: 'node20'
  main: 'dist/index.js'
