name: Buildalon unity-uwp-builder
description: A GitHub Action to build Unity exported UWP projects.
branding:
  icon: package
  color: red
inputs:
  project-path:
    description: The directory that contains the exported visual studio project from Unity.
    required: true
  configuration:
    description: The configuration to use when building the visual studio project. Can be `Master`, `Release`, or `Debug`.
    required: false
    default: 'Master'
  platform:
    description: 'The platform to use when building the visual studio project. Can be: `x86`, `x64`, `ARM`, or `ARM64`. Defaults to platforms defined in the visual studio project.'
    required: false
  package-type:
    description: 'The type of package to generate. Can be: `sideload` or `upload`.'
    required: false
    default: 'sideload'
  certificate-path:
    description: 'The path to the certificate to use when packaging the UWP project. Required when `package-type` is `upload`. Defaults to the Unity generated test certificate.'
    required: false
  certificate-password:
    description: 'The password for the certificate to use when packaging the UWP project. Required when providing your own certificate.'
    required: false
  windows-sdk-version:
    description: 'The Windows SDK version to use for building. If not specified, the latest available SDK version will be automatically detected and used.'
    required: false
  additional-args:
    description: Additional arguments to pass to the msbuild command.
    required: false
  store-association-path:
    description: 'The path to the Package.StoreAssociation.xml file. This is required when `package-type === upload`.'
    required: false
outputs:
  output-directory:
    description: The path to the package output directory.
runs:
  using: 'node20'
  main: 'dist/index.js'
